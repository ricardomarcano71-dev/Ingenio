<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingenio - El Joven Einstein 3D Avanzado</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(18, 26, 43, 0.9);
            --accent-color: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #splash-overlay h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        #splash-overlay p {
            font-size: 1.1rem;
            max-width: 550px;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #94a3b8;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(0, 210, 255, 0.7);
        }

        #ui-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }

        .dialog-box {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 18px;
            padding: 15px 20px;
            width: 100%;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            pointer-events: auto;
        }

        .dialog-box h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dialog-box p {
            font-size: 1rem;
            line-height: 1.4;
            color: #f1f5f9;
        }

        .controls {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .btn-action {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--accent-color);
            color: #0b0f19;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .speaking-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .speaking-indicator.active {
            opacity: 1;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>

    <!-- Cargador oficial y robusto de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="splash-overlay">
        <h1>¡Conoce a Ingenio!</h1>
        <p>Versión 3D Interactiva Avanzada. Toca abajo para activar la experiencia tridimensional con voz y gesticulación.</p>
        <button class="btn-start" onclick="startExperience()">¡COMENZAR EXPERIENCIA 3D!</button>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div class="dialog-box">
            <h2>Ingenio <span id="speech-dot" class="speaking-indicator"></span></h2>
            <p id="speech-text">Presiona el botón para escuchar a Ingenio...</p>
        </div>
        <div class="controls">
            <button class="btn-action" onclick="speakGreeting()">🔊 Hablar de nuevo</button>
            <button class="btn-action" onclick="resetCamera()">🎯 Restablecer Cámara</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let ingenioGroup, headGroup, jawMesh, mouthMesh;
        let eyeLeft, eyeRight;
        let armLeft, armRight;

        let isSpeaking = false;
        let mouthOpenAmount = 0;
        let targetMouthOpen = 0;
        let blinkTimer = 0;
        let speechUtterance = null;

        const greetingText = "¡Hola! Mucho gusto. Mi nombre es Ingenio. Soy un joven científico apasionado por la física, la química y los grandes misterios del universo. ¡Acompañame a descubrir cómo funciona el mundo!";

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
            camera.position.set(0, 1.3, 3.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.target.set(0, 1.1, 0);
                controls.minDistance = 1.5;
                controls.maxDistance = 6.0;
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(2, 4, 3);
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x00d2ff, 0.6);
            fillLight.position.set(-3, 2, -1);
            scene.add(fillLight);

            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);

            createIngenioCharacter();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createIngenioCharacter() {
            ingenioGroup = new THREE.Group();
            scene.add(ingenioGroup);

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
            const coatMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.6 });
            const bowMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.9 });
            const glassesMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
            const mouthMat = new THREE.MeshBasicMaterial({ color: 0x991b1b });

            // Torso y Bata
            const torsoGeo = new THREE.CylinderGeometry(0.32, 0.4, 0.9, 16);
            const torso = new THREE.Mesh(torsoGeo, coatMat);
            torso.position.y = 0.45;
            ingenioGroup.add(torso);

            const shirtGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.5, 16);
            const shirt = new THREE.Mesh(shirtGeo, shirtMat);
            shirt.position.set(0, 0.62, 0.12);
            ingenioGroup.add(shirt);

            // Corbatín
            const bowLeft = new THREE.ConeGeometry(0.08, 0.15, 4);
            bowLeft.rotation.z = Math.PI / 2;
            bowLeft.position.set(-0.06, 0.82, 0.26);
            const bowRight = bowLeft.clone();
            bowRight.rotation.z = -Math.PI / 2;
            bowRight.position.set(0.06, 0.82, 0.26);
            const bowCenter = new THREE.SphereGeometry(0.035, 8, 8);
            bowCenter.position.set(0, 0.82, 0.27);
            const bowGroup = new THREE.Group();
            bowGroup.add(bowLeft, bowRight, bowCenter);
            bowGroup.children.forEach(c => c.material = bowMat);
            ingenioGroup.add(bowGroup);

            // Brazos
            const armGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.6, 12);
            armLeft = new THREE.Group();
            const armLMesh = new THREE.Mesh(armGeo, coatMat);
            armLMesh.position.y = -0.2;
            armLeft.add(armLMesh);
            armLeft.position.set(0.38, 0.8, 0);
            armLeft.rotation.z = -0.2;
            ingenioGroup.add(armLeft);

            armRight = new THREE.Group();
            const armRMesh = armLMesh.clone();
            armRight.add(armRMesh);
            armRight.position.set(-0.38, 0.8, 0);
            armRight.rotation.z = 0.2;
            ingenioGroup.add(armRight);

            // Cabeza
            headGroup = new THREE.Group();
            headGroup.position.y = 1.1;
            ingenioGroup.add(headGroup);

            const headGeo = new THREE.SphereGeometry(0.32, 24, 24);
            headGeo.scale(1, 1.1, 1);
            const headMesh = new THREE.Mesh(headGeo, skinMat);
            headGroup.add(headMesh);

            // Ojos
            const eyeGeo = new THREE.SphereGeometry(0.05, 12, 12);
            eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
            eyeLeft.position.set(0.11, 0.06, 0.28);
            eyeRight = eyeLeft.clone();
            eyeRight.position.x = -0.11;
            headGroup.add(eyeLeft, eyeRight);

            // Gafas
            const glassRimGeo = new THREE.TorusGeometry(0.09, 0.015, 8, 20);
            const glassRimL = new THREE.Mesh(glassRimGeo, glassesMat);
            glassRimL.position.set(0.11, 0.06, 0.3);
            const glassRimR = glassRimL.clone();
            glassRimR.position.x = -0.11;
            const bridgeGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.09, 8);
            const bridge = new THREE.Mesh(bridgeGeo, glassesMat);
            bridge.rotation.z = Math.PI / 2;
            bridge.position.set(0, 0.07, 0.31);
            headGroup.add(glassRimL, glassRimR, bridge);

            // Nariz
            const noseGeo = new THREE.ConeGeometry(0.04, 0.1, 10);
            const nose = new THREE.Mesh(noseGeo, skinMat);
            nose.position.set(0, 0.01, 0.32);
            nose.rotation.x = 0.25;
            headGroup.add(nose);

            // Boca (Lip-Sync)
            jawMesh = new THREE.Group();
            jawMesh.position.set(0, -0.1, 0.27);
            const mouthGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.03, 12, 1, false, 0, Math.PI);
            mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
            mouthMesh.rotation.x = Math.PI / 2;
            mouthMesh.scale.set(1, 0.3, 0.2);
            jawMesh.add(mouthMesh);
            headGroup.add(jawMesh);

            // Cabello Einstein
            const hairGroup = new THREE.Group();
            const hairPuffGeo = new THREE.SphereGeometry(0.13, 10, 10);
            for (let i = 0; i < 40; i++) {
                const hairPuff = new THREE.Mesh(hairPuffGeo, hairMat);
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 0.6 + 0.2;
                const radius = 0.3 + Math.random() * 0.06;
                hairPuff.position.set(
                    radius * Math.sin(v) * Math.cos(u),
                    radius * Math.cos(v) + 0.08,
                    radius * Math.sin(v) * Math.sin(u) - 0.04
                );
                const scale = 0.6 + Math.random() * 0.6;
                hairPuff.scale.set(scale, scale, scale);
                hairGroup.add(hairPuff);
            }
            headGroup.add(hairGroup);
        }

        function initSpeech() {
            if (!('speechSynthesis' in window)) return;

            speechUtterance = new SpeechSynthesisUtterance(greetingText);
            speechUtterance.lang = 'es-VE';
            speechUtterance.pitch = 1.2;
            speechUtterance.rate = 1.0;

            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                const esVoice = voices.find(v => v.lang.includes('es-VE') || v.lang.includes('es-MX') || v.lang.includes('es'));
                if (esVoice) speechUtterance.voice = esVoice;
            };

            speechUtterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('speech-dot').classList.add('active');
            };

            speechUtterance.onend = () => {
                isSpeaking = false;
                targetMouthOpen = 0;
                document.getElementById('speech-dot').classList.remove('active');
            };

            speechUtterance.onboundary = (event) => {
                if (event.name === 'word' || event.name === 'syllable') {
                    targetMouthOpen = 0.6 + Math.random() * 0.4;
                    setTimeout(() => { targetMouthOpen = 0.1; }, 110);
                }
            };
        }

        function speakGreeting() {
            if (!speechUtterance) return;
            window.speechSynthesis.cancel();
            document.getElementById('speech-text').innerText = `"${greetingText}"`;
            window.speechSynthesis.speak(speechUtterance);
        }

        function startExperience() {
            document.getElementById('splash-overlay').style.display = 'none';
            init3D();
            initSpeech();
            setTimeout(() => {
                speakGreeting();
            }, 400);
        }

        function resetCamera() {
            if (controls) {
                controls.reset();
                camera.position.set(0, 1.3, 3.2);
                controls.target.set(0, 1.1, 0);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.003;

            if (isSpeaking) {
                mouthOpenAmount += (targetMouthOpen - mouthOpenAmount) * 0.3;
                if (Math.random() < 0.25) targetMouthOpen = Math.random() * 0.8;
            } else {
                mouthOpenAmount += (0 - mouthOpenAmount) * 0.2;
            }

            if (mouthMesh) {
                mouthMesh.scale.y = 0.3 + mouthOpenAmount * 1.5;
                mouthMesh.scale.x = 1 - mouthOpenAmount * 0.3;
            }

            if (headGroup) {
                headGroup.rotation.y = Math.sin(time * 0.5) * 0.06;
                headGroup.rotation.x = (Math.cos(time * 0.7) * 0.04) + (isSpeaking ? Math.sin(time * 8) * 0.03 : 0);
            }

            if (armLeft && armRight) {
                armLeft.rotation.x = isSpeaking ? Math.sin(time * 4) * 0.18 - 0.15 : 0;
                armRight.rotation.x = isSpeaking ? Math.cos(time * 4) * 0.18 - 0.15 : 0;
            }

            blinkTimer += 0.016;
            if (blinkTimer > 3.2) {
                if (eyeLeft && eyeRight) {
                    eyeLeft.scale.y = 0.1;
                    eyeRight.scale.y = 0.1;
                    setTimeout(() => {
                        eyeLeft.scale.y = 1;
                        eyeRight.scale.y = 1;
                    }, 140);
                }
                blinkTimer = 0;
            }

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
